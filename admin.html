<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tohid Developer — Admin</title><style>body{font-family:Inter,system-ui;background:#070a0f;color:#fff;margin:0;padding:32px}main{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.muted{color:#8992a3}.card{background:#0d121a;border:1px solid #202735;border-radius:14px;padding:18px;margin:16px 0}.orders{display:grid;gap:12px}.order{border:1px solid #202735;border-radius:10px;padding:16px}.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}.status{font-size:12px;padding:5px 8px;border-radius:20px;background:#182033;color:#aeb8ca}.btn{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:700}.approve{background:#fff;color:#080b10}.reject{background:#252c39;color:#fff}.error{color:#ff8d8d}.empty{padding:30px;text-align:center}.login{max-width:420px;margin:80px auto}.input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border-radius:8px;border:1px solid #293142;background:#090d14;color:#fff}.hidden{display:none}</style></head><body><main><div class="top"><div><div class="muted">TOHID.DEV / ADMIN</div><h1>Order verification</h1></div><button class="btn reject" onclick="logout()">Lock panel</button></div><section id="login" class="card login"><h2>Admin access</h2><p class="muted">Enter the admin password configured in Vercel.</p><input id="password" class="input" type="password" placeholder="Admin password"><button class="btn approve" onclick="login()">Open Admin</button><p id="loginError" class="error"></p></section><section id="panel" class="hidden"><div id="message" class="card hidden"></div><div class="row"><h2>Orders</h2><button class="btn reject" onclick="loadOrders()">Refresh</button></div><div id="orders" class="orders"><div class="card empty">Loading…</div></div></section></main><script>let token=sessionStorage.getItem('td_admin_token')||'';const $=id=>document.getElementById(id);function show(){ $('login').classList.toggle('hidden',!!token);$('panel').classList.toggle('hidden',!token);if(token)loadOrders()}function login(){const p=$('password').value;if(!p)return;$('loginError').textContent='';fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+p}}).then(r=>{if(!r.ok)throw Error('Invalid admin password');token=p;sessionStorage.setItem('td_admin_token',token);show()}).catch(e=>$('loginError').textContent=e.message)}function logout(){token='';sessionStorage.removeItem('td_admin_token');show()}async function loadOrders(){try{const r=await fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+token}});if(r.status===401)return logout();const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load orders');render(d.orders||[])}catch(e){$('orders').innerHTML='<div class="card error">'+e.message+'</div>'}}function render(orders){if(!orders.length){$('orders').innerHTML='<div class="card empty">No orders found.</div>';return}$('orders').innerHTML=orders.map(o=>`<article class="order"><div class="row"><strong>${esc(o.order_id)}</strong><span class="status">${esc(o.status)}</span></div><p><b>${esc(o.customer_name)}</b> · ${esc(o.contact)}</p><p>Product: <b>${esc(o.product_name||'Unknown')}</b>${o.price!=null?' · ₹'+esc(o.price):''}</p><p class="muted">${esc(o.requirements||'No requirements')}</p><p>Payment reference: <b>${esc(o.payment_reference||'Not submitted')}</b></p>${o.status==='pending_payment'||o.status==='payment_review'?`<div class="row"><button class="btn approve" onclick="change('${esc(o.order_id)}','paid')">✓ Approve payment</button><button class="btn reject" onclick="change('${esc(o.order_id)}','cancelled')">Reject</button></div>`:''}</article>`).join('')}async function change(id,status){const r=await fetch('/api/admin/orders',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({orderId:id,status})});if(r.status===401)return logout();const d=await r.json();if(!r.ok)return alert(d.error||'Update failed');loadOrders()}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}show();</script></body></html>
